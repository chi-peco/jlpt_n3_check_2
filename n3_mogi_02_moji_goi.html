<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin: 8px 0; font-size: 0.9rem; }
  .choice-item { padding: 3px 0; }
  .ans-btn { display: inline-block; margin-top: 8px; padding: 4px 14px; background: var(--accent); color: #fff; border: none; border-radius: 3px; font-size: 0.8rem; cursor: pointer; }
  .ans-btn:hover { opacity: 0.85; }
  .ans-area { display: none; margin-top: 8px; background: var(--accent-light); border: 1px solid var(--accent); border-radius: 4px; padding: 8px 12px; font-size: 0.88rem; }

<script>
/* =====================================================
   データ構造
   ルビ記法： {漢字|かんじ}   下線：<u>…</u>
   PARTS ＝ 大きな区分（文字・語彙／文法／読解…）。後から追加できます。
   各セクション type:
     "choice" … 4択（選択肢が文字列）
     "usage"  … 問題6（語＋4つの文）
   ===================================================== */

var PARTS = [];

/* ---------- 言語知識（文字・語彙） ---------- */
PARTS.push({
  id: "p-moji",
  title: "言語知識（文字・語彙）",
  sections: [

  /* ===== 問題1 ===== */
  { id: "s1", nav: "問題1 漢字読み", title: "問題1｜漢字読み", type: "choice",
    inst: "＿＿＿のことばの{読|よ}み{方|かた}として{最|もっと}もよいものを、1・2・3・4から{一|ひと}つえらびなさい。",
    instTr: "Pilih satu jawaban yang paling tepat untuk cara membaca kata yang bergaris bawah, dari pilihan 1・2・3・4.",
    items: [
      { n: 1, q: "ごみを<u>回収</u>します。",
        tr: "Kami mengumpulkan (mengangkut) sampah.",
        ch: ["かしゅ","かいしゅ","かしゅう","かいしゅう"], a: 4,
        exs: ["かしゅ　×　歌手（かしゅ）＝penyanyi","かいしゅ　×　（kata ini tidak ada）","かしゅう　×　歌集（かしゅう）＝kumpulan lagu/puisi","かいしゅう　○　回収（かいしゅう）＝pengumpulan/pengambilan kembali"] },
      { n: 2, q: "{彼|かれ}が{毎日|まいにち}<u>努力</u>していることをみんな{知|し}っています。",
        tr: "Semua orang tahu bahwa dia berusaha keras setiap hari.",
        ch: ["どりょく","どろく","どりょうく","どうりょく"], a: 1,
        exs: ["どりょく　○　努力（どりょく）＝usaha/upaya","どろく　×　（kata ini tidak ada）","どりょうく　×　（kata ini tidak ada）","どうりょく　×　動力（どうりょく）＝tenaga penggerak"] },
      { n: 3, q: "{様々|さまざま}な{店|みせ}に{行|い}ったが、<u>結局</u>{欲|ほ}しい{物|もの}は{買|か}えなかった。",
        tr: "Saya pergi ke berbagai toko, tetapi pada akhirnya tidak bisa membeli barang yang saya inginkan.",
        ch: ["けきょうく","けきょく","けっきょく","けっきょうく"], a: 3,
        exs: ["けきょうく　×　（kata ini tidak ada）","けきょく　×　（kata ini tidak ada）","けっきょく　○　結局（けっきょく）＝pada akhirnya","けっきょうく　×　（kata ini tidak ada）"] },
      { n: 4, q: "{冬|ふゆ}の{海岸|かいがん}は{寒|さむ}いので、{木|き}を<u>燃やして</u>{温|あたた}まった。",
        tr: "Pantai di musim dingin terasa dingin, jadi kami membakar kayu untuk menghangatkan badan.",
        ch: ["ふやして","もやして","ひやして","はやして"], a: 2,
        exs: ["ふやして　×　増やして（ふやして）＝menambah","もやして　○　燃やして（もやして）＝membakar","ひやして　×　冷やして（ひやして）＝mendinginkan","はやして　×　生やして（はやして）＝menumbuhkan　例）ひげを生やす＝memelihara kumis/janggut"] },
      { n: 5, q: "{国|くに}の<u>機関</u>に{問|と}い{合|あ}わせる。",
        tr: "Menanyakan (sesuatu) kepada lembaga negara.",
        ch: ["きいかん","きっかん","きかん","きか"], a: 3,
        exs: ["きいかん　×　（kata ini tidak ada）","きっかん　×　（kata ini tidak ada）","きかん　○　機関（きかん）＝lembaga/badan","きか　×　帰化（きか）＝naturalisasi (pindah kewarganegaraan)"] },
      { n: 6, q: "{彼|かれ}は{悪|わる}い{人|ひと}なのではないかと<u>疑って</u>います。",
        tr: "Saya curiga jangan-jangan dia orang jahat.",
        ch: ["つまって","いやがって","おこって","うたがって"], a: 4,
        exs: ["つまって　×　詰まって（つまって）＝tersumbat/penuh","いやがって　×　嫌がって（いやがって）＝tidak suka/menolak","おこって　×　怒って（おこって）＝marah","うたがって　○　疑って（うたがって）＝mencurigai/meragukan"] },
      { n: 7, q: "<u>血液</u>の{検査|けんさ}をすることになりました。",
        tr: "Saya jadi harus menjalani pemeriksaan darah.",
        ch: ["けつえき","けっえき","ちえき","ちえ"], a: 1,
        exs: ["けつえき　○　血液（けつえき）＝darah","けっえき　×　（kata ini tidak ada）","ちえき　×　（kata ini tidak ada）","ちえ　×　知恵（ちえ）＝kebijaksanaan/akal"] },
      { n: 8, q: "わたしは{新|あたら}しい{家|いえ}を<u>建築</u>する{予定|よてい}です。",
        tr: "Saya berencana membangun rumah baru.",
        ch: ["けちく","けんちく","けいちく","けんち"], a: 2,
        exs: ["けちく　×　（kata ini tidak ada）","けんちく　○　建築（けんちく）＝pembangunan (gedung/rumah)","けいちく　×　（kata ini tidak ada）","けんち　×　見地（けんち）＝sudut pandang"] }
    ]
  },

  /* ===== 問題2 ===== */
  { id: "s2", nav: "問題2 表記", title: "問題2｜表記", type: "choice",
    inst: "＿＿＿のことばを{漢字|かんじ}で{書|か}くとき、{最|もっと}もよいものを1・2・3・4から{一|ひと}つえらびなさい。",
    instTr: "Pilih satu jawaban yang paling tepat saat menulis kata yang bergaris bawah dalam kanji, dari pilihan 1・2・3・4.",
    items: [
      { n: 9, q: "サッカーボールは、<u>ごかくけい</u>が12{個|こ}{集|あつ}まってできている。",
        tr: "Bola sepak terbentuk dari gabungan 12 buah segi lima.",
        ch: ["五画型","五角形","五角型","五画形"], a: 2,
        ex: "五角形（ごかくけい）＝segi lima" },
      { n: 10, q: "ごはんを<u>のこして</u>はいけません。",
        tr: "Tidak boleh menyisakan nasi.",
        ch: ["殖して","殊して","残して","殆して"], a: 3,
        ex: "残して（のこして）＝menyisakan" },
      { n: 11, q: "{彼|かれ}は、{日本語|にほんご}に<u>かんしん</u>を{持|も}っている。",
        tr: "Dia memiliki minat terhadap bahasa Jepang.",
        ch: ["間心","間信","関信","関心"], a: 4,
        ex: "関心（かんしん）＝minat/perhatian" },
      { n: 12, q: "スポーツクラブを<u>たいかい</u>することにした。",
        tr: "Saya memutuskan untuk keluar dari klub olahraga.",
        ch: ["追会","適会","退会","述会"], a: 3,
        ex: "退会（たいかい）＝keluar dari keanggotaan (klub/perkumpulan)" },
      { n: 13, q: "わたしは、{小|ちい}さいときから<u>まずしい</u>{生活|せいかつ}をしてきた。",
        tr: "Sejak kecil saya menjalani kehidupan yang miskin.",
        ch: ["貧しい","賃しい","貸しい","貿しい"], a: 1,
        ex: "貧しい（まずしい）＝miskin" },
      { n: 14, q: "{明日|あした}は、{大事|だいじ}な{会議|かいぎ}に<u>しゅっせき</u>する{予定|よてい}です。",
        tr: "Besok saya dijadwalkan menghadiri rapat penting.",
        ch: ["出常","出席","出希","出幕"], a: 2,
        ex: "出席（しゅっせき）＝hadir/menghadiri" }
    ]
  },

  /* ===== 問題3 ===== */
  { id: "s3", nav: "問題3 文脈規定", title: "問題3｜文脈規定", type: "choice",
    inst: "（　　）に{入|い}れるのに{最|もっと}もよいものを、1・2・3・4から{一|ひと}つえらびなさい。",
    instTr: "Pilih satu jawaban yang paling tepat untuk dimasukkan ke dalam (　　), dari pilihan 1・2・3・4.",
    items: [
      { n: 15, q: "{今回|こんかい}の{旅|たび}の（　　）は、おいしいものをたくさん{食|た}べることだ。",
        tr: "Tujuan perjalanan kali ini adalah makan banyak makanan enak.",
        ch: ["{頂上|ちょうじょう}","{意識|いしき}","{位置|いち}","{目的|もくてき}"], a: 4,
        exs: ["頂上（ちょうじょう）＝puncak","意識（いしき）＝kesadaran","位置（いち）＝posisi/letak","目的（もくてき）＝tujuan"] },
      { n: 16, q: "ベトナムでは、バイクに{乗|の}って{移動|いどう}するのが（　　）だ。",
        tr: "Di Vietnam, bepergian dengan naik sepeda motor adalah hal yang umum.",
        ch: ["{一般的|いっぱんてき}","{具体的|ぐたいてき}","{活動的|かつどうてき}","{最終的|さいしゅうてき}"], a: 1,
        exs: ["一般的（いっぱんてき）＝umum/biasa","具体的（ぐたいてき）＝konkret","活動的（かつどうてき）＝aktif/energik","最終的（さいしゅうてき）＝pada akhirnya/final"] },
      { n: 17, q: "この{文章|ぶんしょう}を{読|よ}んでから、5つの（　　）に{答|こた}えてください。",
        tr: "Setelah membaca teks ini, jawablah 5 kuis.",
        ch: ["インフォメーション","アナウンス","クイズ","セミナー"], a: 3,
        exs: ["インフォメーション＝informasi","アナウンス＝pengumuman","クイズ＝kuis","セミナー＝seminar"] },
      { n: 18, q: "{運動|うんどう}をする{前|まえ}に、（　　）して{体|からだ}を{温|あたた}めよう。",
        tr: "Sebelum berolahraga, mari melakukan senam untuk menghangatkan badan.",
        ch: ["{体操|たいそう}","{実験|じっけん}","{行動|こうどう}","{登場|とうじょう}"], a: 1,
        exs: ["体操（たいそう）＝senam","実験（じっけん）＝percobaan/eksperimen","行動（こうどう）＝tindakan/perilaku","登場（とうじょう）＝kemunculan/tampil"] },
      { n: 19, q: "{先生|せんせい}と{一緒|いっしょ}に{英語|えいご}の（　　）の{練習|れんしゅう}をする。",
        tr: "Berlatih pelafalan bahasa Inggris bersama guru.",
        ch: ["{調節|ちょうせつ}","{運転|うんてん}","{感覚|かんかく}","{発音|はつおん}"], a: 4,
        exs: ["調節（ちょうせつ）＝pengaturan/penyesuaian","運転（うんてん）＝mengemudi","感覚（かんかく）＝indra/rasa","発音（はつおん）＝pelafalan"] },
      { n: 20, q: "{迷子|まいご}にならないように、しっかり{手|て}を（　　）いてね。",
        tr: "Supaya tidak tersesat, pegang tangan erat-erat, ya.",
        ch: ["{付|つ}けて","{渡|わた}して","{握|にぎ}って","{伸|の}ばして"], a: 3,
        exs: ["付けて（つけて）＝menempelkan/memasang","渡して（わたして）＝menyerahkan","握って（にぎって）＝menggenggam/memegang erat","伸ばして（のばして）＝merentangkan/memanjangkan"] },
      { n: 21, q: "{将来|しょうらい}は、（　　）が{豊|ゆた}かな{場所|ばしょ}に{住|す}みたい。",
        tr: "Di masa depan, saya ingin tinggal di tempat yang alamnya masih kaya (asri).",
        ch: ["{生活|せいかつ}","{自然|しぜん}","{景色|けしき}","{地球|ちきゅう}"], a: 2,
        exs: ["生活（せいかつ）＝kehidupan","自然（しぜん）＝alam","景色（けしき）＝pemandangan","地球（ちきゅう）＝bumi"] },
      { n: 22, q: "{今日|きょう}の{食事会|しょくじかい}は{席|せき}を（　　）していませんので、{好|す}きな{場所|ばしょ}にお{座|すわ}りください。",

        ch: ["{予定|よてい}","{想定|そうてい}","{指定|してい}","{指導|しどう}"], a: 3,

      { n: 23, q: "{妹|いもうと}を{迎|むか}えに{行|い}くことを（　　）{忘|わす}れて、そのまま{帰|かえ}ってきてしまった。",

  /* ===== 問題4 ===== */
  { id: "s4", nav: "問題4 言い換え類義", title: "問題4｜言い換え類義", type: "choice",

      { n: 27, q: "{新|あたら}しく{建|た}てる{家|いえ}を<u>イメージ</u>する。",

        ch: ["{期待|きたい}","{想像|そうぞう}","{見学|けんがく}","{建設|けんせつ}"], a: 2,

      { n: 28, q: "{今|いま}の{仕事|しごと}は<u>{退屈|たいくつ}だ</u>。",

/* ---------- ここに「言語知識（文法）」「読解」を PARTS.push({...}) で追加します ---------- */

/* =====================================================
   描画
   ===================================================== */
function R(s) {
  return s.replace(/\{([^|}]+)\|([^}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
}
function strip(s) { return s.replace(/<[^>]+>/g, "").replace(/\{([^|}]+)\|([^}]+)\}/g, "$1"); }
function hasRuby(s) { return s.indexOf("{") >= 0; }

function lineBlock(html, id, tr) {
  return '<div class="line-wrap"><div class="line-text">' + html +
    '<div class="sent-id" id="' + id + '">' + tr + '</div></div>' +
    '<div class="btn-group"><button class="btn-r" onclick="toggleRuby(this)">ル</button>' +
    '<button class="btn-s" onclick="toggleSent(\'' + id + '\',this)">訳</button></div></div>';
}

function choicesBlock(ch) {
  var withRuby = ch.some(hasRuby);
  var h = withRuby ? '<button class="btn-r choices-ruby-btn" onclick="toggleChoiceRuby(this)">ル</button>' : '';
  h += '<div class="choices">';
  ch.forEach(function (c, i) { h += '<div class="choice-item">' + (i + 1) + '　' + R(c) + '</div>'; });
  return h + '</div>';
}

function ansBlock(id, mark, inner) {
  return '<button class="ans-btn" onclick="toggleAns(\'' + id + '\')">答えを見る</button>' +
    '<div class="ans-area" id="' + id + '"><span class="correct-mark">' + mark + '</span>' +
    '<div class="sent-id show">' + inner + '</div></div>';
}

function renderChoiceItem(it) {
  var id = "q" + it.n;
  var head = '<div class="mondai-head"><span class="mondai-num">' + it.n + '</span>' + lineBlock(R(it.q), "id-" + id, it.tr) + '</div>';
  var ch = it.ch[it.a - 1];
  var mark = "正答：" + it.a + "　" + strip(ch);
  var inner;
  if (it.exs) {
    inner = it.exs.map(function (e, i) { return (i + 1 === it.a) ? "<b>" + (i + 1) + "　" + e + " ✓</b>" : (i + 1) + "　" + e; }).join("<br>");
  } else {
    inner = "<b>Jawaban: " + it.a + "　" + it.ex + "</b>";
  }
  return '<div class="mondai-card">' + head + '<div class="mondai-body">' + choicesBlock(it.ch) +
    ansBlock("ans-" + id, mark, inner) + '</div></div>';
}

function renderUsageItem(it) {
  var id = "q" + it.n;
  var head = '<div class="mondai-head"><span class="mondai-num">' + it.n + '</span>' +
    '<div class="line-wrap" style="margin:0;"><div class="line-text"><span class="word-head">' + R(it.word) + '</span>' +
    '<div class="sent-id" id="id-' + id + '">' + it.wordTr + '</div></div>' +
    '<div class="btn-group"><button class="btn-r" onclick="toggleRuby(this)">ル</button>' +
    '<button class="btn-s" onclick="toggleSent(\'id-' + id + '\',this)">訳</button></div></div></div>';
  var body = '';
  var inner = [];
  it.s.forEach(function (s, i) {
    body += '<div class="sent-choice">' + lineBlock((i + 1) + "　" + R(s.q), "id-" + id + "-" + (i + 1), s.tr) + '</div>';
    inner.push((i + 1 === it.a ? "<b>" + (i + 1) + "　" + s.ex + "</b>" : (i + 1) + "　" + s.ex));
  });
  return '<div class="mondai-card">' + head + '<div class="mondai-body">' + body +
    ansBlock("ans-" + id, "正答：" + it.a, inner.join("<br>")) + '</div></div>';
}

function renderSection(sec) {
  var h = '<div id="' + sec.id + '" class="section"><div class="section-header">' + sec.title + '</div><div class="section-body">';
  h += '<div class="rei-box"><span class="rei-label">問題文</span>' +
    lineBlock("<b>" + sec.title.split("｜")[0] + "</b>　" + R(sec.inst), "id-" + sec.id + "-inst", sec.instTr) + '</div>';
  var first = sec.items[0].n, last = sec.items[sec.items.length - 1].n;
  h += '<p style="font-size:0.85rem; color:var(--text-light); margin-bottom:8px;">▼ ' + sec.title.split("｜")[0] + '（' + first + '〜' + last + '）</p>';
  sec.items.forEach(function (it) { h += (sec.type === "usage") ? renderUsageItem(it) : renderChoiceItem(it); });
  return h + '</div></div>';
}

(function build() {
  var app = document.getElementById("app");
  var nav = document.getElementById("nav");
  var html = "", navHtml = "";
  PARTS.forEach(function (p) {
    html += '<div class="part-title" id="' + p.id + '">' + p.title + '</div>';
    p.sections.forEach(function (s) {
      html += renderSection(s);
      navHtml += '<a href="#' + s.id + '">' + s.nav + '</a>';
    });
  });
  app.innerHTML = html;
  nav.innerHTML = navHtml;
  var header = document.querySelector("header");
  if (header) nav.style.top = header.offsetHeight + "px";
})();

/* =====================================================
   ボタン動作（サンプルと同じ）
   ===================================================== */
function toggleChoiceRuby(btn) {
  var choices = btn.nextElementSibling;
  if (!choices || !choices.classList.contains("choices")) return;
  var rubies = choices.querySelectorAll("ruby");
  if (rubies.length === 0) return;
  var anyShown = Array.from(rubies).some(function (r) { return r.classList.contains("show"); });
  rubies.forEach(function (r) { r.classList.toggle("show", !anyShown); });
  btn.classList.toggle("active", !anyShown);
}
function toggleRuby(btn) {
  var lineWrap = btn.closest(".line-wrap");
  if (!lineWrap) return;
  var rubies = lineWrap.querySelectorAll("ruby");
  if (rubies.length === 0) return;
  var anyShown = Array.from(rubies).some(function (r) { return r.classList.contains("show"); });
  rubies.forEach(function (r) { r.classList.toggle("show", !anyShown); });
}
function toggleSent(id, btn) {
  var el = document.getElementById(id);
  if (el) el.classList.toggle("show");
}
function toggleAns(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle("show");
  var btn = el.previousElementSibling;
  if (btn && btn.classList.contains("ans-btn")) {
    btn.textContent = el.classList.contains("show") ? "答えを隠す" : "答えを見る";
  }
}
